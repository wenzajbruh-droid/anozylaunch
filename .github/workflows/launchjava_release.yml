name: LaunchJava Release

# Pushing to the `launchjava-release` branch builds a debug-signed APK and publishes a GitHub Release
# tagged launchjava-v<launcher_version_name>. No repository secrets are required.
on:
  push:
    branches:
      - "launchjava-release"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:assembleDebug -Darch=all

      - name: Collect APK and version
        run: |
          mkdir -p out
          ver=$(grep '^launcher_version_name=' ZalithLauncher/gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "RELEASE_TAG=launchjava-v${ver}" >> "$GITHUB_ENV"
          apk=$(find ZalithLauncher/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$apk"
          cp "$apk" "out/LaunchJava-v${ver}.apk"
          ls -la out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LaunchJava ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
