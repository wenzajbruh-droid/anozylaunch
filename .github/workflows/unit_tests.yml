name: Unit Tests

on:
  push:
    branches: [fix/unit-tests]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:testDebugUnitTest --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: ZalithLauncher/build/reports/tests/
          archive: false
